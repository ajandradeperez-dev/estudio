# Verifica que la app Android nativa (android-app/, Capacitor) compile. Solo un APK de prueba SIN firmar: la llave nunca
# está en GitHub; el APK que se publica se firma en la laptop con `npm run apk` (ver CLAUDE.md → App Android nativa).
name: apk

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android-app/**', 'capacitor.config.json', 'scripts/app/**', 'package.json']

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: chmod +x android-app/gradlew
      - run: node scripts/app/apk.mjs --debug
      - uses: actions/upload-artifact@v5
        with:
          name: EstudioPlus-debug
          path: EstudioPlus-debug.apk
          retention-days: 7
