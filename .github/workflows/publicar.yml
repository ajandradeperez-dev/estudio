# Publica la app en GitHub Pages en cada push a main (y a mano desde la pestaña Actions).
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Si llegan dos push seguidos, se publica solo el último
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Si alguna lección no cumple el método de aprendizaje, no se publica
      - run: npm run revisar
      # Versión visible en "Mi progreso": fecha y commit
      - run: echo "APP_VERSION=$(date -u +%F) · ${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      # La app vive en https://<usuario>.github.io/<repositorio>/
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: despliegue
        uses: actions/deploy-pages@v5
