<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>%APP_NOMBRE%</title>
<meta name="description" content="%APP_DESCRIPCION%">
<meta name="apple-mobile-web-app-title" content="%APP_NOMBRE%">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12141a" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap">
<!-- Pantalla de bienvenida: se ve mientras carga la app (main.js la quita) -->
<style>
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#fff;color:#1f2430;font:900 28px/1 Nunito,system-ui,sans-serif;transition:opacity .25s}
#splash img{width:112px;height:112px;border-radius:26px;box-shadow:0 10px 30px rgb(70 82 208 / .35)}
#splash.fuera{opacity:0;pointer-events:none}
@media (prefers-color-scheme:dark){#splash{background:#12141a;color:#eef0f6}}
@media (prefers-reduced-motion:reduce){#splash{transition:none}}
</style>
</head>
<body>

<div id="splash" aria-hidden="true"><img src="/icons/icon-192.png" alt=""><span>%APP_NOMBRE%</span></div>

<div class="app">
  <!-- Barra superior (racha y meta del día) y navegación inferior: las arma src/main.js -->
  <header id="barra" class="barra-sup" aria-label="Racha y meta del día"></header>
  <main id="main"><div id="vista"></div></main>
  <nav id="nav" class="nav-inferior" aria-label="Navegación principal"></nav>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
